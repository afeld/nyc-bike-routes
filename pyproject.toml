[project]
name = "nyc-bike-routes"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "geopandas>=1.2.0",
    "httpx>=0.28.1",
    "pandas>=3.0.3",
]

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.3.260530",
    "pytest>=9.1.1",
    "pytest-playwright>=0.10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
