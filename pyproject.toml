[project]
name = "nyc-bike-routes"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "altair>=6.3.0",
    "folium>=0.20.0",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "streamlit>=1.59.1",
]

[dependency-groups]
data = [
    "geopandas>=1.2.0",
    "httpx>=0.28.1",
]
dev = [
    { include-group = "data" },
    "pandas-stubs>=3.0.3.260530",
    "pytest>=9.1.1",
    "types-geopandas>=1.1.4.20261006",
    "types-shapely>=2.1.0.20260728",
    "watchdog>=6.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
